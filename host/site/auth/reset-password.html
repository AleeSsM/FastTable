<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastTable · Nueva contraseña</title>
    <link rel="icon" href="/assets/favicon.png" type="image/png" />
    <link rel="stylesheet" href="auth.css" />
    <script src="/config.js"></script>
  </head>
  <body>
    <div class="card" id="panel">
      <img src="/assets/logo-icon.png" alt="FastTable" class="auth-brand" width="48" height="48" />
      <h1>Nueva contraseña</h1>
      <p id="lead">Cargando sesión…</p>
      <form id="form" hidden>
        <label for="pass">Contraseña nueva (mín. 8 caracteres)</label>
        <input id="pass" type="password" autocomplete="new-password" required minlength="8" />
        <label for="pass2">Confirmar contraseña</label>
        <input id="pass2" type="password" autocomplete="new-password" required minlength="8" />
        <p class="error" id="err" hidden></p>
        <button type="submit" id="submit">Guardar contraseña</button>
      </form>
      <div class="links" id="links" hidden>
        <a href="/">Inicio (landing)</a>
        <a id="app-link" href="#">Abrir la app web</a>
      </div>
    </div>
    <script src="auth.js"></script>
    <script>
      (async function () {
        const lead = document.getElementById("lead");
        const form = document.getElementById("form");
        const err = document.getElementById("err");
        const links = document.getElementById("links");
        const appLink = document.getElementById("app-link");

        appLink.href = FastTableAuth.appUrl("/reset-password");

        try {
          const client = await FastTableAuth.createClient();
          let { data } = await client.auth.getSession();
          if (!data.session) {
            const params = FastTableAuth.parseAuthParams();
            if (params.code || (params.access_token && params.refresh_token)) {
              await FastTableAuth.handleAuthCallback();
              ({ data } = await client.auth.getSession());
            }
          }
          if (!data.session) {
            lead.textContent =
              "Abre primero el enlace «Restablecer contraseña» del correo en este navegador.";
            links.hidden = false;
            return;
          }
          lead.textContent = "Elige una contraseña nueva para tu cuenta.";
          form.hidden = false;
          links.hidden = false;

          form.addEventListener("submit", async (e) => {
            e.preventDefault();
            err.hidden = true;
            const p = document.getElementById("pass").value;
            const p2 = document.getElementById("pass2").value;
            if (p.length < 8) {
              err.textContent = "Usa al menos 8 caracteres.";
              err.hidden = false;
              return;
            }
            if (p !== p2) {
              err.textContent = "Las contraseñas no coinciden.";
              err.hidden = false;
              return;
            }
            const btn = document.getElementById("submit");
            btn.disabled = true;
            btn.textContent = "Guardando…";
            const { error } = await client.auth.updateUser({ password: p });
            if (error) {
              err.textContent = FastTableAuth.formatError(error.message);
              err.hidden = false;
              btn.disabled = false;
              btn.textContent = "Guardar contraseña";
              return;
            }
            document.getElementById("panel").innerHTML =
              '<h1 class="success">Contraseña actualizada</h1>' +
              '<p>Ya puedes entrar con tu correo y la contraseña nueva.</p>' +
              '<a class="btn" href="' +
              FastTableAuth.appUrl("/") +
              '">Ir a la app</a>' +
              '<a class="btn btn--ghost" href="/">Volver al inicio</a>';
          });
        } catch (e) {
          lead.textContent = e.message || "Error al cargar.";
        }
      })();
    </script>
  </body>
</html>
